<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月間収支レポート</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="top"><a class="brand" href="/">WS Card Manager</a><a class="add" href="/card/new">＋ カード追加</a></header><main class="wrap"><div class="panel"><h1>月間収支レポート</h1><form method="get" class="toolbar"><label for="month">対象月　</label><input id="month" name="month" type="month" value="{{month}}" required><button class="btn primary">表示</button></form><div class="stats report-stats"><div class="stat"><small>購入総額</small><strong>¥{{"{:,.0f}".format(data.buy)}}</strong></div><div class="stat"><small>売却総額</small><strong>¥{{"{:,.0f}".format(data.sell)}}</strong></div><div class="stat"><small>現金収支</small><strong>¥{{"{:,.0f}".format(data.sell-data.buy)}}</strong></div><div class="stat"><small>売却利益</small><strong>¥{{"{:,.0f}".format(data.profit)}}</strong></div><div class="stat"><small>取引件数</small><strong>{{data.count}}</strong></div></div><p class="muted">現金収支は売却総額－購入総額です。売却利益は平均取得原価に基づく実現損益です。</p><a class="btn" href="/">カード一覧へ戻る</a></div></main></body></html>
