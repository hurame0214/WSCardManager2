<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カード追加</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js"></script></head><body><header class="top"><a class="brand" href="/">WS Card Manager</a></header><main class="wrap"><div class="panel"><h1 class="card-title">カード追加</h1><div class="official"><b>ブシロード公式から取得</b><p class="muted">カード番号を入力して検索すると、公式ページから基本情報・画像URLを取得します。</p><div class="row"><input id="official_card_number" placeholder="例：DAL/W79-001"><button type="button" class="btn" onclick="officialLookup()">公式サイトから検索</button></div><div id="officialResult"></div></div><form id="f" class="form" method="post"><label>カード名<input id="name" name="name" required></label><div class="row"><label>カード番号<input id="card_number" name="card_number"></label><label>タイトル<input id="title" name="title"></label></div><div class="row"><label>レアリティ<input id="rarity" name="rarity"></label><label>公式画像URL<input id="image_url" name="image_url"></label></div><label>メモ<textarea name="notes" rows="3"></textarea></label><h3>初回購入（任意）</h3><div class="row"><label>購入合計金額（円）<input name="buy_total_amount" type="number" min="0" step="1" value=""></label><label>購入枚数<input name="buy_quantity" type="number" min="0" step="1" value="1"></label></div><label>購入日<input name="trans_date" type="date" id="purchase_date"><script>document.getElementById('purchase_date').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);</script></label><div class="actions"><button class="btn primary" type="submit">保存</button><a class="btn" href="/">キャンセル</a></div></form></div></main></body></html>
