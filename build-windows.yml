name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm WSCardManager.spec

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WSCardManager.exe release/
          Copy-Item README.txt release/
          Set-Content -Path release/使い方.txt -Value @"
          【WS Card Manager】

          WSCardManager.exe をダブルクリックして起動してください。
          Pythonのインストールは不要です。

          初回起動後、ブラウザで http://127.0.0.1:5000 が開きます。
          アプリを終了するときは、EXEの黒い画面を閉じてください。
          "@ -Encoding UTF8

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSCardManager-Windows
          path: release/
